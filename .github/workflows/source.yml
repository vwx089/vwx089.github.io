name: SideStore-Quelle

# Baut source.json aus allen Apps in apps.json und legt sie hier ab.
# GitHub Pages liefert sie unter https://vwx089.github.io/source.json aus.
# Neue Releases der App-Repos werden alle 15 Minuten abgeholt.
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["apps.json", "build_source.py", ".github/workflows/source.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sidestore-source
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Quelle bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build_source.py source.json

      - name: Speichern (nur bei Änderung)
        run: |
          if git diff --quiet -- source.json && git ls-files --error-unmatch source.json >/dev/null 2>&1; then
            echo "Quelle unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Quelle aktualisiert"
          git push
          cat source.json
